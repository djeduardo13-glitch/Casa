<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Casa</title>
  <meta name="description" content="Agenda di famiglia condivisa: appuntamenti, da pagare, spesa, scadenze documenti." />
  <meta name="theme-color" content="#0c0f14" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Casa" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" />
  <link rel="stylesheet" href="styles.css" />
  <script>
    // tema applicato subito, prima di disegnare la pagina (niente lampeggi)
    (function () {
      var t = 'giorno';
      try { t = localStorage.getItem('casa-tema') || 'giorno'; } catch (e) {}
      if (t === 'auto') t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'notte' : 'giorno';
      document.documentElement.setAttribute('data-tema', t);
      document.querySelector('meta[name="theme-color"]').setAttribute('content', t === 'notte' ? '#0c0f14' : '#f5f3ef');
    })();
  </script>
</head>
<body>
  <div id="app"><div class="caricamento">Caricamento…</div></div>
  <script src="config.js"></script>
  <script src="vendor/supabase.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
